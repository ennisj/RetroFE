name: RetroFE Continuous Integration

# Builds RetroFE and the retrofe_tests unit tests on Windows, Linux (x86_64 and arm64)
# and macOS, and runs the tests on each (docs/CI.md). Runs on pushes to master and to
# feature/** and ci/** branches, on pull requests to master and feature/**, and by hand.
# Development is Windows-first for now (docs/DECISIONS.md W4): Linux and macOS run only
# for master and when started by hand.
on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'ci/**'
    paths:
      - 'RetroFE/CMake/**'
      - 'RetroFE/Source/**'
      - 'RetroFE/ThirdParty/**'
      - 'RetroFE/ThirdPartyMac/**'
      - 'RetroFE/Tests/**'
      - 'Scripts/test-build/**/*.py'
      - 'Scripts/test-build/fixtures/**'
      - 'Scripts/test-build/screens/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    branches:
      - master
      - 'feature/**'
    paths:
      - 'RetroFE/CMake/**'
      - 'RetroFE/Source/**'
      - 'RetroFE/ThirdParty/**'
      - 'RetroFE/ThirdPartyMac/**'
      - 'RetroFE/Tests/**'
      - 'Scripts/test-build/**/*.py'
      - 'Scripts/test-build/fixtures/**'
      - 'Scripts/test-build/screens/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still going, except on master, where
# every push's run finishes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  linux:
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.config.os }}
    name: Linux ${{ matrix.config.arch }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          zlib1g-dev \
          libsdl2-dev \
          libsdl2-mixer-dev \
          libsdl2-image-dev \
          libsdl2-ttf-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libgstreamer-plugins-good1.0-dev \
          gstreamer1.0-libav \
          libglib2.0-dev \
          libminizip-dev \
          libwebp-dev \
          libevdev-dev \
          libusb-1.0-0-dev

    - name: Configure CMake
      run: cmake RetroFE/Source -BRetroFE/Build -DRETROFE_BUILD_TESTS=ON

    - name: Build
      # As many jobs as cores: an unbounded make -j runs the runner out of memory
      run: cmake --build RetroFE/Build --parallel "$(nproc)"

    - name: Run the unit tests
      run: ctest --test-dir RetroFE/Build --output-on-failure

    - name: Check that retrofe starts
      # --version prints and exits before any window opens
      env:
        RETROFE_PATH: ${{ runner.temp }}/retrofe-root
      run: |
        mkdir -p "$RETROFE_PATH"
        RetroFE/Build/retrofe --version

  windows:
    runs-on: windows-2022
    name: Windows x64
    # Publish the management-ui-latest and ci-screens pre-releases
    permissions:
      contents: write

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache GStreamer
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/gstreamer-downloads
        key: gstreamer-msvc-${{ hashFiles('.github/scripts/install-gstreamer-windows.ps1') }}

    - name: Install GStreamer
      shell: pwsh
      run: .github/scripts/install-gstreamer-windows.ps1

    - name: Configure
      shell: pwsh
      run: |
        cmake -A x64 -B .\RetroFE\Build -D "GSTREAMER_ROOT=$env:GSTREAMER_ROOT" -D RETROFE_BUILD_TESTS=ON -S .\RetroFE\Source

    - name: Build
      # Compiler and linker errors are repeated as annotations, which (unlike the log)
      # can be read without signing in to GitHub
      shell: pwsh
      run: |
        cmake --build RetroFE/Build --config Release --parallel 4 2>&1 | Tee-Object -Variable out
        if ($LASTEXITCODE -ne 0) {
          $out | ForEach-Object { "$_" } | Where-Object { $_ -match ': (fatal )?error [A-Z]+\d+' } |
            ForEach-Object { $_.Trim() } | Select-Object -Unique -First 30 |
            ForEach-Object { '::error::' + $_.Replace('%', '%25') }
          throw "The build failed"
        }

    - name: Run the unit tests
      # Failing checks and the "N/M checks passed" line are repeated as annotations,
      # like the build's errors
      shell: pwsh
      env:
        # The first-setup test leaves its finished install here for the screens step
        RETROFE_KEEP_FIRST_SETUP: ${{ runner.temp }}\first-setup
      run: |
        ctest --test-dir RetroFE/Build -C Release -V 2>&1 | Tee-Object -Variable out
        $failed = $LASTEXITCODE -ne 0
        $lines = $out | ForEach-Object { "$_" }
        $lines | Where-Object { $_ -match 'FAIL \[|^\d+: (FAIL|ERROR): ' } | Select-Object -First 40 |
          ForEach-Object { '::error::' + ($_ -replace '^\d+: ', '').Trim().Replace('%', '%25') }
        $lines | Where-Object { $_ -match 'checks passed' } | Select-Object -Last 1 |
          ForEach-Object { '::notice::' + ($_ -replace '^\d+: ', '').Trim() }
        if ($failed) { throw "The unit tests failed" }

    - name: Check screens in the real program
      # Scripts/test-build/screens: retrofe.exe in a window on this runner, in a bare and a
      # Starter-like test install, driven by key presses posted to its window, with a
      # screenshot after each step (README there). While the scripts are being tuned, a
      # failing script is a warning, not a failed build (DECISIONS M34).
      id: screens
      continue-on-error: true
      shell: pwsh
      run: |
        $out = "dist\screens"
        New-Item -ItemType Directory -Force $out | Out-Null
        $failed = @()
        foreach ($script in Get-ChildItem "Scripts\test-build\screens\scripts\*.txt" | Sort-Object Name) {
          $kind = $script.BaseName.Split('-')[0]
          $install = Join-Path $env:RUNNER_TEMP "screens-$($script.BaseName)"
          $setup = @()
          if ($kind -eq 'starter') { $setup = @('--setup', "$env:RUNNER_TEMP\first-setup") }
          python -I Scripts\test-build\screens\screens.py install --kind $kind `
            --exe RetroFE\Build\Release\retrofe.exe --dlls Package\Environment\Windows\retrofe `
            --common Package\Environment\Common @setup $install
          if ($LASTEXITCODE -ne 0) { $failed += "$($script.BaseName): the install couldn't be made"; continue }
          python -I Scripts\test-build\screens\screens.py run --install $install --script $script.FullName `
            --out "$out\$($script.BaseName)" 2>&1 | Tee-Object -Variable lines
          if ($LASTEXITCODE -ne 0) {
            $why = ($lines | ForEach-Object { "$_" } | Where-Object { $_ -match '^FAIL ' } | Select-Object -First 1)
            $failed += "$($script.BaseName): $why"
            if ($why -match 'exit code 0xC') {
              # A crash: run it once more under the debugger, whose stack and module list
              # go into the published zip as cdb.txt
              $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
              if (Test-Path $cdb) {
                $log = "$out\$($script.BaseName)\cdb.txt"
                $p = Start-Process $cdb -WorkingDirectory $install -PassThru -NoNewWindow `
                  -RedirectStandardOutput $log -ArgumentList @('-g', '-G', '-c', '".lastevent; kv 40; lm; q"',
                  "`"$install\retrofe\retrofe.exe`"", '-fullscreen', 'no', '-horizontal', '960', '-vertical', '540')
                if (-not $p.WaitForExit(90000)) { $p.Kill(); "cdb timed out" | Add-Content $log }
              }
              else { "::warning::No cdb.exe at $cdb" }
            }
          }
        }
        $shots = (Get-ChildItem -Recurse "$out\*.png").Count
        "::notice::Screens: $shots screenshots from $((Get-ChildItem $out -Directory).Count) scripts"
        $failed | ForEach-Object { '::warning::' + $_.Replace('%', '%25') }
        if ($failed) { throw "A screens script failed" }

    - name: Publish the screenshots
      # Every run's screenshots go to the ci-screens pre-release as screens-<commit>.zip
      # (the 30 newest are kept), downloadable without signing in, so they can be
      # reviewed without the Actions log.
      if: ${{ !cancelled() && github.event_name == 'push' && steps.screens.outcome != 'skipped' }}
      continue-on-error: true
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = 'ci-screens'
        if (-not (Test-Path dist\screens) -or -not (Get-ChildItem dist\screens -File -Recurse)) { "No screenshot files to publish"; exit 0 }
        $name = "screens-$($env:GITHUB_SHA.Substring(0, 8)).zip"
        Compress-Archive -Path dist\screens\* -DestinationPath "dist\$name" -Force
        gh release view $tag *> $null
        if ($LASTEXITCODE -ne 0) {
          gh release create $tag --prerelease --target $env:GITHUB_SHA --title 'CI screenshots' `
            --notes 'Screenshots from Scripts/test-build/screens, one zip per commit (screens-<commit>.zip). Not a release.'
          if ($LASTEXITCODE -ne 0) { throw "Could not create the ci-screens pre-release" }
        }
        gh release upload $tag "dist\$name" --clobber
        if ($LASTEXITCODE -ne 0) { throw "Could not upload $name" }
        $old = gh release view $tag --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[30:] | .[].name'
        $old | Where-Object { $_ } | ForEach-Object {
          gh release delete-asset $tag $_ --yes
          if ($LASTEXITCODE -ne 0) { "::warning::Could not delete screenshot asset $_" }
        }
        "::notice::Screenshots: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$tag/$name"
        exit 0

    - name: Publish the build for testing
      # Each push to feature/management-ui that passes replaces the management-ui-latest
      # pre-release: retrofe\retrofe.exe and layouts\Aeon Nox, laid out like an install
      # (without the DLLs, which an install already has), and BUILD.txt naming the
      # commit. It can be downloaded without signing in.
      if: github.event_name == 'push' && github.ref == 'refs/heads/feature/management-ui'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = 'management-ui-latest'
        $name = 'RetroFE-management-ui-windows-x64.zip'
        $out = "dist\RetroFE"
        New-Item -ItemType Directory -Force "$out\retrofe", "$out\layouts" | Out-Null
        Copy-Item "RetroFE\Build\Release\retrofe.exe" "$out\retrofe\retrofe.exe"
        Copy-Item -Recurse "Package\Environment\Common\layouts\Aeon Nox" "$out\layouts\Aeon Nox"
        $commit = git log -1 --format='%H%n%cI%n%s'
        Set-Content -Path "$out\BUILD.txt" -Encoding utf8 -Value @(
          "feature/management-ui", $commit,
          "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID")
        $zip = "dist\$name"
        Compress-Archive -Path "$out\*" -DestinationPath $zip
        $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
        Set-Content -Path "$zip.sha256" -Value "$hash  $name" -NoNewline -Encoding ascii
        "SHA-256 $hash"
        # Recreated rather than updated, so the tag moves to this commit
        gh release delete $tag --yes --cleanup-tag *> $null
        gh release create $tag $zip "$zip.sha256" --prerelease --target $env:GITHUB_SHA `
          --title 'Management UI (latest test build)' `
          --notes "Windows test build of feature/management-ui at $env:GITHUB_SHA. Not a release: unzip over an install that already has RetroFE's DLLs."
        if ($LASTEXITCODE -ne 0) { throw "Could not publish the pre-release" }

  macos:
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    name: macOS arm64 (Homebrew)
    # Homebrew's libraries, as a developer's Mac would have them; build-macos.yml makes
    # the universal RetroFE.app against the frameworks instead

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install pkg-config sdl2 sdl2_image sdl2_mixer sdl2_ttf gstreamer minizip webp libusb

    - name: Configure CMake
      run: cmake RetroFE/Source -BRetroFE/Build -DRETROFE_BUILD_TESTS=ON

    - name: Build
      run: cmake --build RetroFE/Build --parallel "$(sysctl -n hw.ncpu)"

    - name: Run the unit tests
      run: ctest --test-dir RetroFE/Build --output-on-failure

    - name: Check that retrofe starts
      env:
        RETROFE_PATH: ${{ runner.temp }}/retrofe-root
      run: |
        mkdir -p "$RETROFE_PATH"
        RetroFE/Build/retrofe --version
